<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Garden</title>
  <style>
    :root {
      --bg-1: #f7f1e7;
      --bg-2: #eedaaf;
      --panel: rgba(255,255,255,0.78);
      --board: #d7c39b;
      --cell: #f8f1df;
      --text: #2f241f;
      --muted: #6a564a;
      --accent: #ff8c5d;
      --accent-2: #ffc857;
      --success: #4ab65d;
      --shadow: rgba(60, 41, 25, 0.18);
      --gold: #f0ba47;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game-shell {
      width: min(92vw, 470px);
      background: var(--panel);
      border-radius: 28px;
      border: 1px solid rgba(100,80,60,0.06);
      box-shadow: 0 24px 42px var(--shadow);
      backdrop-filter: blur(12px);
      padding: 16px 14px 18px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.05em;
    }

    .mini-badge {
      background: rgba(255,255,255,0.75);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat {
      background: rgba(255,255,255,0.8);
      border-radius: 16px;
      padding: 9px 8px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
    }

    .label {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      font-size: 1.08rem;
      font-weight: 900;
    }

    .board-wrap {
      background: rgba(255,255,255,0.35);
      border-radius: 18px;
      padding: 12px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.03);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: var(--board);
      padding: 10px;
      border-radius: 18px;
      min-height: 350px;
    }

    .cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: var(--cell);
      border: 2px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .cell:hover { transform: translateY(-2px); }
    .cell.empty::before {
      content: "＋";
      position: absolute;
      font-size: 1.5rem;
      font-weight: 900;
      color: rgba(60,52,44,0.18);
    }

    .item {
      width: 74%;
      height: 74%;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.15rem, 4vw, 2rem);
      font-weight: 900;
      box-shadow: inset 0 -10px 14px rgba(255,255,255,0.18), 0 8px 16px rgba(0,0,0,0.08);
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.16);
      animation: pop 0.18s ease;
      user-select: none;
      position: relative;
    }

    @keyframes pop {
      0% { transform: scale(0.72); opacity: 0.35; }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
    }

    button:active { transform: translateY(1px) scale(0.99); }
    button:hover { filter: brightness(1.03); }

    .primary { background: linear-gradient(180deg, var(--accent), #eb7042); color: white; }
    .secondary { background: #f4e5c0; color: var(--text); }
    .warn { background: linear-gradient(180deg, #4bb7c7, #2d9ba6); color: white; }

    .shop {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .shop-card {
      background: rgba(255,255,255,0.78);
      border-radius: 14px;
      padding: 10px 8px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }

    .shop-title {
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .shop-cost {
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 6px;
      color: var(--text);
    }

    .shop-btn {
      width: 100%;
      background: linear-gradient(180deg, #f7dc7b, #f0ba47);
      border: none;
      border-radius: 10px;
      padding: 9px 6px;
      font-weight: 900;
      cursor: pointer;
    }

    .shop-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .message {
      min-height: 34px;
      margin-top: 12px;
      text-align: center;
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--muted);
    }

    .helper {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.35);
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      line-height: 1.45;
    }

    @media (max-width: 420px) {
      .board { min-height: 300px; }
      .shop { grid-template-columns: 1fr; }
      .hud { grid-template-columns: repeat(2, 1fr); }
      .value { font-size: 1rem; }
      .brand { font-size: 1.34rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <div class="brand">Merge Garden</div>
      <div class="mini-badge" id="comboBadge">x1 Combo</div>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Coins</span>
        <span class="value" id="coinValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Level</span>
        <span class="value" id="levelValue">1</span>
      </div>
      <div class="stat">
        <span class="label">Goal</span>
        <span class="value" id="goalValue">100</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="primary" id="produceBtn">Produce</button>
      <button class="secondary" id="boostBtn">Boost</button>
      <button class="warn" id="dailyBtn">Daily</button>
      <button class="warn" id="resetBtn">Reset</button>
    </div>

    <div class="shop" id="shop"></div>
    <div class="helper">Merge the same crops to grow larger plants, unlock upgrades, and reach the next level.</div>
    <div class="message" id="statusMessage">Fresh soil ready. Start merging your crops!</div>
  </div>

  <script>
    const BOARD_SIZE = 5;
    const board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

    const ITEMS = {
      1: { emoji: '🌱', a: '#8dd77d', b: '#60b85f' },
      2: { emoji: '🌿', a: '#6bce7d', b: '#4cb362' },
      3: { emoji: '🌼', a: '#f7c948', b: '#ef9f22' },
      4: { emoji: '🍋', a: '#ffd96b', b: '#f3b100' },
      5: { emoji: '🍊', a: '#ffb26f', b: '#ec7e3a' },
      6: { emoji: '🌳', a: '#67d3b5', b: '#3ba68a' },
      7: { emoji: '💎', a: '#74c7ff', b: '#3b8eed' },
      8: { emoji: '🌙', a: '#8d7df8', b: '#5a4dc2' },
      9: { emoji: '✨', a: '#ffb5d9', b: '#ff75a8' }
    };

    const upgradeDefs = {
      water: { title: 'Water', baseCost: 20 },
      soil: { title: 'Soil', baseCost: 25 },
      luck: { title: 'Luck', baseCost: 30 }
    };

    const state = {
      score: 0,
      coins: 0,
      level: 1,
      combo: 1,
      goal: 100,
      lastMessage: 'Fresh soil ready. Start merging your crops!',
      upgrades: { water: 0, soil: 0, luck: 0 },
      dailyClaimed: false
    };

    const boardEl = document.getElementById('board');
    const scoreValueEl = document.getElementById('scoreValue');
    const coinValueEl = document.getElementById('coinValue');
    const levelValueEl = document.getElementById('levelValue');
    const goalValueEl = document.getElementById('goalValue');
    const statusMessageEl = document.getElementById('statusMessage');
    const comboBadgeEl = document.getElementById('comboBadge');
    const shopEl = document.getElementById('shop');

    function createCell(x, y) {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.dataset.x = String(x);
      cell.dataset.y = String(y);
      cell.addEventListener('click', () => {
        if (board[x][y] === null) {
          placeRandomCell(x, y);
          resolveBoard();
          renderBoard();
          updateHud();
          playTone(390, 0.04, 'triangle');
        }
      });
      return cell;
    }

    function initBoard() {
      boardEl.innerHTML = '';
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          boardEl.appendChild(createCell(x, y));
        }
      }
    }

    function randomValue() {
      const roll = Math.random();
      if (roll < 0.52) return 1;
      if (roll < 0.8) return 2;
      if (roll < 0.92) return 3;
      return 4;
    }

    function sampleValue() {
      const roll = Math.random();
      if (roll < 0.58) return randomValue();
      if (roll < 0.8) return 5;
      if (roll < 0.9) return 6;
      return 7;
    }

    function placeRandomCell(x, y) {
      if (board[x][y] !== null) return;
      board[x][y] = sampleValue();
    }

    function addRandomItem() {
      const empties = [];
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (board[x][y] === null) empties.push([x, y]);
        }
      }
      if (!empties.length) return false;
      const [x, y] = empties[Math.floor(Math.random() * empties.length)];
      board[x][y] = sampleValue();
      return true;
    }

    function compactBoard() {
      const newBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
      let writeIndex = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const value = board[x][y];
          if (value !== null) {
            const row = Math.floor(writeIndex / BOARD_SIZE);
            const col = writeIndex % BOARD_SIZE;
            newBoard[row][col] = value;
            writeIndex += 1;
          }
        }
      }
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = newBoard[x][y];
        }
      }
    }

    function mergeAdjacent() {
      let didMerge = false;
      let mergeCount = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const current = board[x][y];
          if (current === null) continue;
          const right = y + 1 < BOARD_SIZE ? board[x][y + 1] : null;
          const down = x + 1 < BOARD_SIZE ? board[x + 1][y] : null;

          if (right === current) {
            board[x][y] = current + 1;
            board[x][y + 1] = null;
            mergeCount += 1;
            didMerge = true;
            const base = current * 35;
            const bonus = 1 + (state.upgrades.soil * 0.25);
            state.score += Math.round(base * bonus);
            state.coins += current * 6 + state.upgrades.water;
            state.combo = Math.min(9, state.combo + 1);
          } else if (down === current) {
            board[x][y] = current + 1;
            board[x + 1][y] = null;
            mergeCount += 1;
            didMerge = true;
            const base = current * 35;
            const bonus = 1 + (state.upgrades.soil * 0.25);
            state.score += Math.round(base * bonus);
            state.coins += current * 6 + state.upgrades.water;
            state.combo = Math.min(9, state.combo + 1);
          }
        }
      }

      if (mergeCount > 0) {
        playTone(620, 0.08, 'sine');
        setTimeout(() => playTone(760, 0.06, 'triangle'), 50);
        state.lastMessage = `Perfect merge! +${mergeCount * 35} score`;
      }
      return didMerge;
    }

    function resolveBoard() {
      let changed = true;
      let pass = 0;
      while (changed && pass < 12) {
        changed = mergeAdjacent();
        compactBoard();
        pass += 1;
      }
      if (!changed) state.combo = 1;
    }

    function getUpgradeCost(key) {
      return upgradeDefs[key].baseCost + state.upgrades[key] * 12;
    }

    function renderShop() {
      shopEl.innerHTML = '';
      Object.entries(upgradeDefs).forEach(([key, def]) => {
        const card = document.createElement('div');
        card.className = 'shop-card';

        const title = document.createElement('div');
        title.className = 'shop-title';
        title.textContent = def.title;

        const cost = document.createElement('div');
        cost.className = 'shop-cost';
        cost.textContent = `Cost: ${getUpgradeCost(key)} coins`;

        const button = document.createElement('button');
        button.className = 'shop-btn';
        button.textContent = `Lv ${state.upgrades[key]}`;
        button.disabled = state.coins < getUpgradeCost(key);
        button.addEventListener('click', () => buyUpgrade(key));

        card.appendChild(title);
        card.appendChild(cost);
        card.appendChild(button);
        shopEl.appendChild(card);
      });
    }

    function buyUpgrade(key) {
      const cost = getUpgradeCost(key);
      if (state.coins < cost) {
        state.lastMessage = `Need ${cost} coins for ${upgradeDefs[key].title}.`;
        updateHud();
        return;
      }
      state.coins -= cost;
      state.upgrades[key] += 1;
      state.lastMessage = `${upgradeDefs[key].title} upgraded!`;
      renderShop();
      updateHud();
    }

    function updateHud() {
      state.level = Math.max(1, Math.floor(state.score / 120) + 1);
      state.goal = state.level * 100;
      comboBadgeEl.textContent = `x${state.combo} Combo`;
      scoreValueEl.textContent = state.score;
      coinValueEl.textContent = state.coins;
      levelValueEl.textContent = state.level;
      goalValueEl.textContent = state.goal;
      statusMessageEl.textContent = state.lastMessage;
      renderShop();
    }

    function renderBoard() {
      const cells = boardEl.children;
      let index = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const cell = cells[index];
          const value = board[x][y];
          cell.classList.toggle('empty', value === null);
          cell.innerHTML = '';
          if (value !== null) {
            const meta = ITEMS[value] || ITEMS[9];
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = meta.emoji;
            item.style.background = `linear-gradient(180deg, ${meta.a}, ${meta.b})`;
            cell.appendChild(item);
          }
          index += 1;
        }
      }
    }

    function playTone(freq, duration, type = 'sine') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audioCtx = new AudioCtx();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = freq;
      gain.gain.value = 0.04;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      setTimeout(() => {
        oscillator.stop();
        oscillator.disconnect();
        gain.disconnect();
        audioCtx.close();
      }, duration * 1000);
    }

    function resetGame() {
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = null;
        }
      }
      state.score = 0;
      state.coins = 0;
      state.level = 1;
      state.combo = 1;
      state.goal = 100;
      state.lastMessage = 'Fresh soil ready. Start merging your crops!';
      state.dailyClaimed = false;
      state.upgrades = { water: 0, soil: 0, luck: 0 };
      board[0][0] = 1;
      board[0][1] = 1;
      board[1][0] = 2;
      board[2][2] = 3;
      board[4][4] = 2;
      renderBoard();
      updateHud();
    }

    document.getElementById('produceBtn').addEventListener('click', () => {
      const success = addRandomItem();
      if (success) {
        const bonus = 15 + (state.upgrades.water * 5);
        resolveBoard();
        state.score += bonus;
        state.coins += 3 + state.upgrades.water;
        if (Math.random() < (state.upgrades.luck > 0 ? 0.18 : 0.08)) {
          state.coins += 5;
          state.lastMessage = 'Lucky harvest! Bonus coins earned.';
        } else {
          state.lastMessage = 'New seed has arrived!';
        }
      } else {
        state.lastMessage = 'Board is full! Merge some crops first.';
      }
      renderBoard();
      updateHud();
      playTone(320, 0.05, 'triangle');
    });

    document.getElementById('boostBtn').addEventListener('click', () => {
      if (state.coins < 15) {
        state.lastMessage = 'Need 15 coins to use boost.';
        updateHud();
        return;
      }
      state.coins -= 15;
      for (let i = 0; i < 3; i++) addRandomItem();
      resolveBoard();
      state.score += 60 + state.upgrades.soil * 10;
      state.lastMessage = 'Boost activated. New plants have sprouted!';
      renderBoard();
      updateHud();
      playTone(500, 0.08, 'sawtooth');
    });

    document.getElementById('dailyBtn').addEventListener('click', () => {
      if (state.dailyClaimed) {
        state.lastMessage = 'Daily reward already claimed today.';
        updateHud();
        return;
      }
      const reward = 20 + state.level * 5;
      state.coins += reward;
      state.score += reward * 3;
      state.dailyClaimed = true;
      state.lastMessage = `Daily reward claimed: +${reward} coins!`;
      renderBoard();
      updateHud();
      playTone(660, 0.06, 'square');
    });

    document.getElementById('resetBtn').addEventListener('click', resetGame);

    initBoard();
    resetGame();
  </script>
</body>
</html>
