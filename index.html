<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Garden</title>
  <style>
    :root {
      --bg-1: #f7f1e7;
      --bg-2: #f2e7d5;
      --panel: rgba(255,255,255,0.75);
      --board: #d8c6a9;
      --cell: #f7eddc;
      --text: #2f261f;
      --muted: #6e584d;
      --accent: #ff8b5e;
      --accent-2: #ffc857;
      --success: #4abf68;
      --shadow: rgba(63, 40, 17, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .game-shell {
      width: min(92vw, 440px);
      background: var(--panel);
      border: 1px solid rgba(100, 80, 60, 0.08);
      border-radius: 28px;
      box-shadow: 0 22px 38px var(--shadow);
      backdrop-filter: blur(10px);
      padding: 16px 14px 18px;
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: rgba(255,255,255,0.78);
      border-radius: 16px;
      text-align: center;
      padding: 10px 8px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }

    .label {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }

    .value {
      font-size: 1.14rem;
      font-weight: 900;
    }

    .board-wrap {
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 12px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.03);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: var(--board);
      padding: 10px;
      border-radius: 18px;
      min-height: 360px;
    }

    .cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: var(--cell);
      border: 2px solid rgba(80,60,36,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
      overflow: hidden;
    }

    .cell:hover {
      transform: translateY(-2px);
    }

    .cell.empty::before {
      content: "+";
      position: absolute;
      font-size: 1.7rem;
      color: rgba(76,58,36,0.22);
      font-weight: 700;
    }

    .item {
      width: 74%;
      height: 74%;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      box-shadow: inset 0 -10px 16px rgba(255,255,255,0.18), 0 10px 20px rgba(0,0,0,0.08);
      color: white;
      text-shadow: 0 2px 0 rgba(0,0,0,0.15);
      animation: pop 0.18s ease;
      user-select: none;
    }

    .cell.merged .item {
      animation: burst 0.25s ease;
    }

    @keyframes pop {
      0% { transform: scale(0.72); opacity: 0.35; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes burst {
      0% { transform: scale(0.9); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
      box-shadow: 0 10px 14px rgba(0,0,0,0.08);
    }

    button:active { transform: translateY(1px) scale(0.99); }
    button:hover { filter: brightness(1.02); }

    .primary {
      background: linear-gradient(180deg, var(--accent), #ed6d44);
      color: white;
    }

    .secondary {
      background: #f2e0b6;
      color: var(--text);
    }

    .warn {
      background: linear-gradient(180deg, #64c4c7, #3fa5b0);
      color: white;
    }

    .message {
      min-height: 28px;
      margin-top: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .board { min-height: 300px; }
      .hud { gap: 8px; }
      .label { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Coins</span>
        <span class="value" id="coinValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Level</span>
        <span class="value" id="levelValue">1</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="primary" id="produceBtn">Produce</button>
      <button class="secondary" id="boostBtn">Boost</button>
      <button class="warn" id="resetBtn">Reset</button>
    </div>

    <div class="message" id="statusMessage">Merge plant seeds to grow a thriving garden!</div>
  </div>

  <script>
    const BOARD_SIZE = 5;
    const board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

    const ITEMS = {
      1: { emoji: '🌱', colorA: '#86d97f', colorB: '#5abf58' },
      2: { emoji: '🌿', colorA: '#6ecf78', colorB: '#44b95b' },
      3: { emoji: '🌼', colorA: '#f6bb42', colorB: '#ef9f2b' },
      4: { emoji: '🍋', colorA: '#ffd86a', colorB: '#f7b500' },
      5: { emoji: '🍊', colorA: '#ff9f5a', colorB: '#f1703a' },
      6: { emoji: '🌳', colorA: '#5ec1a6', colorB: '#3b9a7d' },
      7: { emoji: '💎', colorA: '#6ec6ff', colorB: '#3e8ef7' },
      8: { emoji: '🌙', colorA: '#8f7efc', colorB: '#5f52d6' },
      9: { emoji: '✨', colorA: '#ffd4de', colorB: '#ff7ab6' }
    };

    const state = {
      score: 0,
      coins: 0,
      level: 1,
      lastMessage: 'Merge plant seeds to grow a thriving garden!'
    };

    const boardEl = document.getElementById('board');
    const scoreValueEl = document.getElementById('scoreValue');
    const coinValueEl = document.getElementById('coinValue');
    const levelValueEl = document.getElementById('levelValue');
    const statusMessageEl = document.getElementById('statusMessage');

    function createCell(x, y) {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.dataset.x = String(x);
      cell.dataset.y = String(y);
      cell.addEventListener('click', () => {
        if (board[x][y] === null) {
          placeRandomCell(x, y);
          resolveBoard();
          renderBoard();
          updateHud();
        }
      });
      return cell;
    }

    function initBoard() {
      boardEl.innerHTML = '';
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          boardEl.appendChild(createCell(x, y));
        }
      }
    }

    function randomValue() {
      const roll = Math.random();
      if (roll < 0.52) return 1;
      if (roll < 0.76) return 2;
      if (roll < 0.9) return 3;
      return 4;
    }

    function sampleValue() {
      return Math.random() < 0.7 ? randomValue() : (Math.random() < 0.5 ? 5 : 6);
    }

    function countEmptyCells() {
      let count = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (board[x][y] === null) count++;
        }
      }
      return count;
    }

    function placeRandomCell(x, y) {
      if (board[x][y] !== null) return;
      board[x][y] = sampleValue();
    }

    function addRandomItem() {
      const empty = [];
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (board[x][y] === null) empty.push([x, y]);
        }
      }

      if (!empty.length) {
        state.lastMessage = 'Board full! Merge nearby plants.';
        return false;
      }

      const [x, y] = empty[Math.floor(Math.random() * empty.length)];
      board[x][y] = sampleValue();
      return true;
    }

    function mergeAdjacent() {
      let mergedCount = 0;
      let didMerge = false;

      const visited = new Set();

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const key = `${x},${y}`;
          if (visited.has(key) || board[x][y] === null) continue;

          const value = board[x][y];
          const right = y + 1 < BOARD_SIZE ? board[x][y + 1] : null;
          const down = x + 1 < BOARD_SIZE ? board[x + 1][y] : null;

          if (right === value) {
            board[x][y] = value + 1;
            board[x][y + 1] = null;
            mergedCount += 1;
            didMerge = true;
            visited.add(`${x},${y + 1}`);
            state.score += value * 25;
            state.coins += value * 5;
          } else if (down === value) {
            board[x][y] = value + 1;
            board[x + 1][y] = null;
            mergedCount += 1;
            didMerge = true;
            visited.add(`${x + 1},${y}`);
            state.score += value * 25;
            state.coins += value * 5;
          }
        }
      }

      if (mergedCount > 0) {
        state.lastMessage = `Perfect merge! +${mergedCount * 25} score`;
      }

      return didMerge;
    }

    function compactBoard() {
      const newBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
      let writeIndex = 0;

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const value = board[x][y];
          if (value !== null) {
            newBoard[Math.floor(writeIndex / BOARD_SIZE)][writeIndex % BOARD_SIZE] = value;
            writeIndex += 1;
          }
        }
      }

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = newBoard[x][y];
        }
      }
    }

    function resolveBoard() {
      let hasMerged = true;
      let pass = 0;
      while (hasMerged && pass < 10) {
        hasMerged = mergeAdjacent();
        compactBoard();
        pass += 1;
      }
    }

    function updateHud() {
      state.level = Math.max(1, Math.floor(Math.sqrt(state.score + 1)) + 1);
      scoreValueEl.textContent = state.score;
      coinValueEl.textContent = state.coins;
      levelValueEl.textContent = state.level;
      statusMessageEl.textContent = state.lastMessage;
    }

    function renderBoard() {
      const cells = boardEl.children;
      let i = 0;

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const cell = cells[i];
          const value = board[x][y];

          cell.classList.remove('merged');
          cell.classList.toggle('empty', value === null);
          cell.innerHTML = '';

          if (value !== null) {
            const item = document.createElement('div');
            item.className = 'item';
            const meta = ITEMS[value] || ITEMS[9];
            item.textContent = meta.emoji;
            item.style.background = `linear-gradient(180deg, ${meta.colorA}, ${meta.colorB})`;
            cell.appendChild(item);
          }

          i += 1;
        }
      }
    }

    function resetGame() {
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = null;
        }
      }

      state.score = 0;
      state.coins = 0;
      state.level = 1;
      state.lastMessage = 'Fresh soil prepared. Start growing your garden!';

      board[0][0] = 1;
      board[0][1] = 1;
      board[1][0] = 2;
      board[2][2] = 3;
      board[3][3] = 2;
      renderBoard();
      updateHud();
    }

    document.getElementById('produceBtn').addEventListener('click', () => {
      const success = addRandomItem();
      if (success) {
        resolveBoard();
        state.score += 10;
        state.coins += 2;
        state.lastMessage = 'A new seed has sprouted!';
      } else {
        state.lastMessage = 'Board is full! Merge some plants first.';
      }
      renderBoard();
      updateHud();
    });

    document.getElementById('boostBtn').addEventListener('click', () => {
      if (state.coins < 15) {
        state.lastMessage = 'Need 15 coins to use boost.';
        updateHud();
        return;
      }

      state.coins -= 15;
      for (let i = 0; i < 3; i++) {
        addRandomItem();
      }
      resolveBoard();
      state.score += 40;
      state.lastMessage = 'Boost used! Three new plants appear.';
      renderBoard();
      updateHud();
    });

    document.getElementById('resetBtn').addEventListener('click', resetGame);

    initBoard();
    resetGame();
  </script>
</body>
</html>
