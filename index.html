<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merge Garden</title>
  <style>
    :root {
      --bg-1: #f5f0e8;
      --bg-2: #eedfc9;
      --panel: rgba(255, 255, 255, 0.75);
      --board: #d9c4a0;
      --cell: #f9f0dd;
      --text: #332922;
      --muted: #6e584d;
      --accent: #ff8b5e;
      --accent-2: #ffc857;
      --success: #4abf68;
      --shadow: rgba(53, 39, 24, 0.18);
      --danger: #ef6a72;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .game-shell {
      width: min(92vw, 440px);
      background: var(--panel);
      border-radius: 30px;
      border: 1px solid rgba(100, 80, 60, 0.06);
      box-shadow: 0 22px 40px var(--shadow);
      padding: 18px 14px 16px;
      backdrop-filter: blur(12px);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .mini-badge {
      background: rgba(255,255,255,0.72);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: rgba(255,255,255,0.78);
      border-radius: 16px;
      padding: 9px 8px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
    }

    .label {
      display: block;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 5px;
    }

    .value {
      font-size: 1.1rem;
      font-weight: 900;
    }

    .board-wrap {
      background: rgba(255,255,255,0.35);
      border-radius: 20px;
      padding: 12px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.03);
    }

    .board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: var(--board);
      padding: 10px;
      border-radius: 18px;
      min-height: 345px;
    }

    .cell {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      background: var(--cell);
      border: 2px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.12s ease;
    }

    .cell:hover {
      transform: translateY(-1px);
    }

    .cell.empty::before {
      content: "＋";
      position: absolute;
      font-size: 1.6rem;
      font-weight: 900;
      color: rgba(60, 52, 44, 0.18);
    }

    .item {
      width: 74%;
      height: 74%;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(1.2rem, 4vw, 2rem);
      font-weight: 900;
      box-shadow: inset 0 -10px 16px rgba(255,255,255,0.18), 0 10px 20px rgba(0,0,0,0.08);
      color: #fff;
      text-shadow: 0 2px 0 rgba(0,0,0,0.16);
      animation: pop 0.18s ease;
      user-select: none;
    }

    @keyframes pop {
      0% { transform: scale(0.72); opacity: 0.35; }
      100% { transform: scale(1); opacity: 1; }
    }

    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 14px;
      padding: 14px 10px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease;
      box-shadow: 0 8px 15px rgba(0,0,0,0.08);
    }

    button:active { transform: translateY(1px) scale(0.99); }
    button:hover { filter: brightness(1.02); }

    .primary {
      background: linear-gradient(180deg, var(--accent), #ed6d44);
      color: white;
    }

    .secondary {
      background: #f3e5bf;
      color: var(--text);
    }

    .warn {
      background: linear-gradient(180deg, #4eb6c4, #2e9ca8);
      color: white;
    }

    .message {
      min-height: 32px;
      margin-top: 12px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
    }

    @media (max-width: 420px) {
      .board { min-height: 304px; }
      .hud { gap: 7px; }
      .value { font-size: 1rem; }
      .brand { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="top-bar">
      <div class="brand">Merge Garden</div>
      <div class="mini-badge" id="comboBadge">x1 Combo</div>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="scoreValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Coins</span>
        <span class="value" id="coinValue">0</span>
      </div>
      <div class="stat">
        <span class="label">Level</span>
        <span class="value" id="levelValue">1</span>
      </div>
      <div class="stat">
        <span class="label">Goal</span>
        <span class="value" id="goalValue">100</span>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board"></div>
    </div>

    <div class="controls">
      <button class="primary" id="produceBtn">Produce</button>
      <button class="secondary" id="boostBtn">Boost</button>
      <button class="warn" id="resetBtn">Reset</button>
    </div>

    <div class="message" id="statusMessage">Fresh soil ready. Start merging your crops!</div>
  </div>

  <script>
    const BOARD_SIZE = 5;
    const board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));

    const ITEMS = {
      1: { emoji: '🌱', a: '#8dd77d', b: '#60b85f' },
      2: { emoji: '🌿', a: '#6bce7d', b: '#4cb362' },
      3: { emoji: '🌼', a: '#f7c948', b: '#ef9f22' },
      4: { emoji: '🍋', a: '#ffd96b', b: '#f3b100' },
      5: { emoji: '🍊', a: '#ffb26f', b: '#ec7e3a' },
      6: { emoji: '🌳', a: '#67d3b5', b: '#3ba68a' },
      7: { emoji: '💎', a: '#74c7ff', b: '#3b8eed' },
      8: { emoji: '🌙', a: '#8d7df8', b: '#5a4dc2' },
      9: { emoji: '✨', a: '#ffb5d9', b: '#ff75a8' }
    };

    const state = {
      score: 0,
      coins: 0,
      level: 1,
      combo: 1,
      goal: 100,
      lastMessage: 'Fresh soil ready. Start merging your crops!'
    };

    const boardEl = document.getElementById('board');
    const scoreValueEl = document.getElementById('scoreValue');
    const coinValueEl = document.getElementById('coinValue');
    const levelValueEl = document.getElementById('levelValue');
    const goalValueEl = document.getElementById('goalValue');
    const statusMessageEl = document.getElementById('statusMessage');
    const comboBadgeEl = document.getElementById('comboBadge');

    function createCell(x, y) {
      const cell = document.createElement('div');
      cell.className = 'cell empty';
      cell.dataset.x = String(x);
      cell.dataset.y = String(y);
      cell.addEventListener('click', () => {
        if (board[x][y] === null) {
          placeRandomCell(x, y);
          resolveBoard();
          renderBoard();
          updateHud();
          playTone(430, 0.04, 'triangle');
        }
      });
      return cell;
    }

    function initBoard() {
      boardEl.innerHTML = '';
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          boardEl.appendChild(createCell(x, y));
        }
      }
    }

    function randomValue() {
      const roll = Math.random();
      if (roll < 0.52) return 1;
      if (roll < 0.8) return 2;
      if (roll < 0.92) return 3;
      return 4;
    }

    function sampleValue() {
      const roll = Math.random();
      if (roll < 0.58) return randomValue();
      if (roll < 0.78) return 5;
      if (roll < 0.9) return 6;
      return 7;
    }

    function countEmptyCells() {
      let count = 0;
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (board[x][y] === null) count++;
        }
      }
      return count;
    }

    function placeRandomCell(x, y) {
      if (board[x][y] !== null) return;
      board[x][y] = sampleValue();
    }

    function addRandomItem() {
      const empties = [];
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          if (board[x][y] === null) empties.push([x, y]);
        }
      }

      if (!empties.length) return false;
      const [x, y] = empties[Math.floor(Math.random() * empties.length)];
      board[x][y] = sampleValue();
      return true;
    }

    function compactBoard() {
      const newBoard = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(null));
      let writeIndex = 0;

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const value = board[x][y];
          if (value !== null) {
            const row = Math.floor(writeIndex / BOARD_SIZE);
            const col = writeIndex % BOARD_SIZE;
            newBoard[row][col] = value;
            writeIndex += 1;
          }
        }
      }

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = newBoard[x][y];
        }
      }
    }

    function mergeAdjacent() {
      let didMerge = false;
      let mergeCount = 0;

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const current = board[x][y];
          if (current === null) continue;

          const right = y + 1 < BOARD_SIZE ? board[x][y + 1] : null;
          const down = x + 1 < BOARD_SIZE ? board[x + 1][y] : null;

          if (right === current) {
            board[x][y] = current + 1;
            board[x][y + 1] = null;
            mergeCount += 1;
            didMerge = true;
            state.score += current * 35;
            state.coins += current * 6;
            state.combo = Math.min(9, state.combo + 1);
          } else if (down === current) {
            board[x][y] = current + 1;
            board[x + 1][y] = null;
            mergeCount += 1;
            didMerge = true;
            state.score += current * 35;
            state.coins += current * 6;
            state.combo = Math.min(9, state.combo + 1);
          }
        }
      }

      if (mergeCount > 0) {
        playTone(620, 0.08, 'sine');
        setTimeout(() => playTone(780, 0.06, 'triangle'), 60);
        state.lastMessage = `Perfect merge! +${mergeCount * 35} score`;
      }

      return didMerge;
    }

    function resolveBoard() {
      let changed = true;
      let pass = 0;
      while (changed && pass < 12) {
        changed = mergeAdjacent();
        compactBoard();
        pass += 1;
      }

      if (!changed) state.combo = 1;
    }

    function updateHud() {
      state.level = Math.max(1, Math.floor(state.score / 120) + 1);
      state.goal = state.level * 100;
      comboBadgeEl.textContent = `x${state.combo} Combo`;
      scoreValueEl.textContent = state.score;
      coinValueEl.textContent = state.coins;
      levelValueEl.textContent = state.level;
      goalValueEl.textContent = state.goal;
      statusMessageEl.textContent = state.lastMessage;
    }

    function renderBoard() {
      const cells = boardEl.children;
      let index = 0;

      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          const cell = cells[index];
          const value = board[x][y];
          cell.classList.toggle('empty', value === null);
          cell.innerHTML = '';

          if (value !== null) {
            const meta = ITEMS[value] || ITEMS[9];
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = meta.emoji;
            item.style.background = `linear-gradient(180deg, ${meta.a}, ${meta.b})`;
            cell.appendChild(item);
          }

          index += 1;
        }
      }
    }

    function playTone(freq, duration, type = 'sine') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;

      const audioCtx = new AudioCtx();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      oscillator.type = type;
      oscillator.frequency.value = freq;
      gain.gain.value = 0.04;

      oscillator.connect(gain);
      gain.connect(audioCtx.destination);

      oscillator.start();
      setTimeout(() => {
        oscillator.stop();
        oscillator.disconnect();
        gain.disconnect();
        audioCtx.close();
      }, duration * 1000);
    }

    function resetGame() {
      for (let x = 0; x < BOARD_SIZE; x++) {
        for (let y = 0; y < BOARD_SIZE; y++) {
          board[x][y] = null;
        }
      }

      state.score = 0;
      state.coins = 0;
      state.level = 1;
      state.combo = 1;
      state.goal = 100;
      state.lastMessage = 'Fresh soil ready. Start merging your crops!';

      board[0][0] = 1;
      board[0][1] = 1;
      board[1][0] = 2;
      board[2][2] = 3;
      board[4][4] = 2;

      renderBoard();
      updateHud();
    }

    document.getElementById('produceBtn').addEventListener('click', () => {
      const success = addRandomItem();
      if (success) {
        resolveBoard();
        state.score += 15;
        state.coins += 3;
        state.lastMessage = 'New seed has arrived!';
      } else {
        state.lastMessage = 'Board is full! Merge some crops first.';
      }
      renderBoard();
      updateHud();
      playTone(320, 0.05, 'triangle');
    });

    document.getElementById('boostBtn').addEventListener('click', () => {
      if (state.coins < 15) {
        state.lastMessage = 'Need 15 coins to use boost.';
        updateHud();
        return;
      }

      state.coins -= 15;
      for (let i = 0; i < 3; i++) addRandomItem();
      resolveBoard();
      state.score += 50;
      state.lastMessage = 'Boost activated. Fresh plants have spawned!';
      renderBoard();
      updateHud();
      playTone(510, 0.08, 'sawtooth');
    });

    document.getElementById('resetBtn').addEventListener('click', resetGame);

    initBoard();
    resetGame();
  </script>
</body>
</html>
